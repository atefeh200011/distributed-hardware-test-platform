name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (sanitizers ${{ matrix.sanitizers }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizers:
          - "OFF"
          - "ON"

    env:
      BUILD_DIRECTORY: build-ci-${{ matrix.sanitizers }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            ninja-build \
            nlohmann-json3-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B "${BUILD_DIRECTORY}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHWTEST_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build "${BUILD_DIRECTORY}"

      - name: Test
        run: |
          ctest \
            --test-dir "${BUILD_DIRECTORY}" \
            --output-on-failure
            